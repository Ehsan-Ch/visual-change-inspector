[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-change-inspector"
version = "1.0.0"
description = "Alignment-aware visual change inspection with a reproducible controlled benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "opencv-python-headless>=4.10,<5", "Pillow>=10,<13"]

[project.optional-dependencies]
benchmark = ["scikit-image>=0.25,<0.27"]

[project.scripts]
change-inspector = "change_inspector.cli:main"

[tool.setuptools.package-data]
change_inspector = ["template.html"]

[tool.setuptools.packages.find]
include = ["change_inspector*"]
